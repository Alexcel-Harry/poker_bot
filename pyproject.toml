[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-arena"
version = "0.1.0"
description = "A small event-sourced No Limit Hold'em engine for bot experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Poker Arena contributors" }]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
